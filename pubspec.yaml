name: detoxo
description: "Detoxo - block short-form video and reclaim your attention"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+3

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # No cupertino_icons: nothing references the CupertinoIcons class, so it only
  # ever shipped a font asset for an unused API. Re-add if iOS-style glyphs land.
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  go_router: ^17.3.0
  # No dio / http client: this build is offline-first and nothing in lib/ makes a
  # request. `upgrader` brings its own client for the Play version check.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_secure_storage: ^10.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  path_provider: ^2.1.5
  local_auth: ^3.0.1
  flutter_local_notifications: ^22.0.0
  permission_handler: ^12.0.3
  app_settings: ^7.0.0
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  # In-app "update available" prompt. Used only as the Play-Store version-check /
  # store-launch / dismissal-persistence engine; the dialog UI is our own glass
  # AppDialog (see features/additional_feature/app_upgrader).
  upgrader: ^13.5.0
  # No google_mobile_ads / in_app_purchase: nothing imports them, and shipping
  # them declares Advertising ID + Billing to Play while the in-app FAQ promises
  # "no ads, no ad tracking". Re-add when monetization is actually built.
  # No workmanager: nothing in lib/ uses it, and androidx.work drags
  # FOREGROUND_SERVICE / WAKE_LOCK / RECEIVE_BOOT_COMPLETED into the merged
  # manifest. Background work is the native accessibility service. Re-add when
  # a Dart-side periodic task actually exists.
  cached_network_image: ^3.4.1
  # No liquid_swipe / ms_undraw: neither is imported anywhere. Onboarding uses
  # our own PageView, and every illustration is a local asset.
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  uuid: ^4.5.3
  collection: ^1.19.1
  crypto: ^3.0.6
  # No flutter_gen here: it is a build-time CLI, not a runtime package —
  # lib/gen/assets.gen.dart imports only flutter + flutter_svg. Install it with
  # `brew install FlutterGen/tap/fluttergen` (see tool/dev.sh assets).
  # No lottie_tgs: nothing renders a Lottie file anywhere in lib/.

  # Design system: motion, type ramp, native iOS controls, floating nav.
  flutter_animate: ^4.5.2
  google_fonts: ^8.1.0
  cupertino_native: ^0.1.1
  flutter_floating_bottom_bar: ^1.2.1
  not_static_icons: ^0.46.0
  # Swipe-to-reveal row actions (web blocklist rows). First/only swipe surface.
  flutter_slidable: ^4.0.0
  sleek_circular_slider: ^2.1.0
  showcaseview: ^5.1.0

  # No home_widget: the reel-counter widget is pinned, rendered and refreshed
  # over our own command channel (`pinContentWidget` / `refreshContentWidget`);
  # the plugin leg wrote keys native never read and its pin() could not tell a
  # launcher that can't pin from one that can.
  feedback: ^3.2.0
  flutter_email_sender: ^10.0.1
  # In-app browser for hosted legal pages (Privacy Policy / Terms), rendered in
  # our own GlassScaffold. See features/help/legal.
  webview_flutter: ^4.13.0
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  firebase_crashlytics: ^5.2.4
  firebase_performance: ^0.11.4+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Host-side driver for the perf run. `integration_test` already pulls this in
  # transitively, but test_driver/perf_driver.dart imports it directly, and
  # `depend_on_referenced_packages` (correctly) wants that declared.
  flutter_driver:
    sdk: flutter

  # Lint rule sets. `lints` provides the Dart core/recommended rules; the
  # `flutter_lints` set builds on top with Flutter-specific rules. Both are
  # activated and extended in `analysis_options.yaml`.
  lints: ^6.1.0
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  drift_dev: ^2.33.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

# FlutterGen — typed asset accessors in lib/gen/assets.gen.dart.
# Regenerate with `fluttergen` (or `bash tool/dev.sh assets`) after ANY asset
# rename; the accessor name drops the extension, so a .png → .webp swap leaves
# every call site untouched.
# Lottie integration stays OFF: nothing renders a Lottie file, so `Assets.lottie.*`
# is only ever a plain String path.
flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      class_name: Assets
      style: dot-delimiter
      package_parameter_enabled: false
  fonts:
    enabled: false

# App launcher icon configuration. Regenerate with: dart run flutter_launcher_icons
#
# The source artwork lives in tool/branding/, NOT under assets/ — `assets:` below
# declares whole directories, so anything dropped in assets/images/ ships inside
# the APK. This file is a build-time input only; it was costing every user 2.3 MB.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "tool/branding/detoxo_app_icon.png"
  remove_alpha_ios: true
  # Sampled from the artwork's edge, so the corners the adaptive/iOS mask cuts
  # away blend instead of showing a seam. Foreground keeps the default 16%
  # inset — the artwork is full-bleed and gets clipped inside the safe zone
  # without it.
  background_color_ios: "#1E4DE5"
  adaptive_icon_background: "#1E4DE5"
  adaptive_icon_foreground: "tool/branding/detoxo_app_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/config/
    - assets/content/
    - assets/images/
    - assets/images/bg/
    - assets/images/illustration/
    - assets/images/social_icon_pack/
    - assets/lottie/
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
